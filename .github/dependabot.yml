version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # the build runs on Node 22; keep the type definitions on a matching major
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the Go rewrite) does not work with vue-tsc yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: monthly }
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /deploy/server
    schedule: { interval: monthly }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # build stage only; stay on the Node LTS line the CI uses
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
