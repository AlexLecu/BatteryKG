# BatteryKG app theme (blue = the paper's primary; ink text tones;
# no custom CSS anywhere — matplotlib keeps the palette from app/common.py)
[theme]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1f2937"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
