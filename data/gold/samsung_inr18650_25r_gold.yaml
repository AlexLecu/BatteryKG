# GOLD STANDARD — Samsung SDI INR18650-25R, completat manual din
# "Specification of product", Spec. No. INR18650-25R, Version 1.0, Mar. 2014
# (In-Young Jang). Fisier sursa incarcat: Samsung-INR18650-25R-Datasheet.pdf
#
# Conventie `page`: pagina FIZICA din PDF (1 = coperta). Footer-ul intern
# "N/16" corespunde paginii PDF N+1 (ex.: sectiunea 3.0 e pe footer 2/16,
# deci page: 3).
#
# Acoperire: 3.0 Nominal specifications (integral) + 7.3–7.12 Characteristics
# (integral, inclusiv tabelele de dependenta de temperatura si de rata).
# 6.1 (25±5℃, 65±20% RH) e conditie de test generala, nu proprietate de
# celula — nu genereaza claim, dar e citata in notes unde e relevanta.
# 8.x/9.x (mecanic/safety) si 10.0 (warranty 18 luni) sunt criterii de test /
# termeni comerciali, nu specificatii electrice de celula — excluse deliberat.
#
# Ramase de completat de catre om (nu sunt derivabile din document):
#   source_url, retrieved
#
# PROVENIENTA ADNOTARII (important pentru protocolul held-out): acest gold a
# fost REDACTAT DE UN LLM (Claude) din documentul sursa, apoi aliniat la
# regulile exp10/exp11. Documentul ramane nevazut de pipeline-ul de extractie,
# dar gold-ul NU e adnotare pur manuala — necesita verificare umana
# independenta contra PDF-ului inainte de scorare, si declarare corecta in
# paper (LLM-drafted, human-verified).
#
# Aliniere la regulile exp10/exp11 (re-check aplicat):
#   R2  o valoare repetata = UN claim, la aparitia cea mai completa
#       (nominal capacity: pastrat 7.3/page 4; 3.1, nota(1), 3.7 "60%",
#       handling p.12/13 — doar mentionate in notes)
#   R4  cross-reference resolution marcata explicit in notes (cycle life)
#   R5  cycle_life_retention_pct = claim separat, pe langa end_condition
#   R6  NEVERIFICAT contra data/claims/README.md (indisponibil aici).
#       Nume candidate, posibil noi sau sinonime de redenumit inainte de
#       scorare: charge_temp_range_c, discharge_temp_range_c,
#       storage_temp_range_{1_5yr,3mo,1mo}_c, rel_*_pct (toate cele 17),
#       cycle_life_retention_pct, storage_recovery_pct, ex_factory_soc_pct,
#       ex_factory_ocv_range_v, std/rapid_charge_time_min,
#       max_charge_voltage_v (vs. eventual charge_voltage_v din vocab).
#       Daca raman noi: rulat scripts/gen_claims_vocab.py.

cell_model: Samsung INR18650-25R
manufacturer: Samsung SDI
source_document: Samsung-INR18650-25R-Datasheet.pdf
source_url: TODO                      # de unde a fost descarcat PDF-ul
retrieved: TODO                       # YYYY-MM-DD

# Proprietati verificat ABSENTE — document parcurs exhaustiv (toate cele 16
# pagini, inclusiv Fig.1/Fig.2, handling, remarci si revision history).
omissions:
  - property: nominal_energy_wh
    note: "energia nominala nu apare nicaieri; doar capacitate (mAh) si tensiune (V) separate — cautat in 3.0 si 7.x"
  - property: specific_energy_wh_kg
    note: "densitatea energetica nu e declarata; doar masa max (3.9) si capacitate — cautat in tot documentul"
  - property: max_pulse_discharge_a
    note: "nu exista rating de descarcare in impuls; doar continuu 20A (3.7) — cautat in 3.0, 7.9 si sectiunile de safety"
  - property: dc_internal_resistance_mohm
    note: "doar impedanta AC 1kHz (7.5); rezistenta DC (ex. IEC pulse) nu e specificata"
  - property: self_discharge_pct_per_month
    note: "auto-descarcarea nu e cuantificata; exista doar recuperarea >=90% dupa stocare (3.12 nota 1, 7.11)"

claims:
  # ==========================================================================
  # 3.0 Nominal specifications — footer 2/16, page 3
  # ==========================================================================

  # nominal_capacity_ah: afirmata si aici (3.1, cu conditii partiale), dar
  # per regula 2 e UN singur claim, pastrat la aparitia cea mai completa (7.3,
  # page 4) — vezi mai jos.

  - property: nominal_voltage_v
    value: 3.6
    unit: V
    page: 3
    stated_conditions:
      text: "unspecified"

  - property: std_charge_current_a
    value: 1.25
    unit: A
    page: 3
    stated_conditions:
      text: "Standard charge: CCCV, 1.25A, 4.20 ± 0.05 V, 125mA cut-off"

  - property: max_charge_voltage_v
    value: 4.2
    unit: V
    page: 3
    stated_conditions:
      text: "Standard charge: CCCV, 1.25A, 4.20 ± 0.05 V, 125mA cut-off"
    notes: "toleranta ±0.05V ramane doar in text; confirmata ca limita si in handling (p. 13: 'Cut-off voltage of charging must be less than 4.2 + 0.05V')"

  - property: fast_charge_current_a
    value: 4
    unit: A
    page: 3
    stated_conditions:
      text: "Rapid charge: CCCV, 4A, 4.20 ± 0.05 V, 100mA cut-off"
    notes: "in 7.8 apare ca 'Maximum rapid charge 4A' — functioneaza si ca max charge current"

  - property: std_charge_time_min
    value: 180
    unit: min
    page: 3
    stated_conditions:
      text: "Standard charge : 180min / 125mA cut-off"

  - property: rapid_charge_time_min
    value: 60
    unit: min
    page: 3
    stated_conditions:
      text: "Rapid charge: 60min (at 25℃) / 100mA cut-off"
      temperature_c: 25

  - property: max_cont_discharge_a
    value: 20
    unit: A
    page: 3
    stated_conditions:
      text: "Max. continuous discharge (Continuous): 20A(at 25℃), 60% at 250 cycle"
      temperature_c: 25
    notes: "bound Max; '60% at 250 cycle' leaga rating-ul de criteriul de cycle life din 7.10"

  - property: discharge_cutoff_v
    value: 2.5
    unit: V
    page: 3
    stated_conditions:
      text: "Discharge cut-off voltage / End of discharge: 2.5V"

  - property: mass_g
    value: 45.0
    unit: g
    page: 3
    stated_conditions:
      text: "Cell weight: 45.0g max"
    notes: "bound Max"

  - property: cell_height_mm
    value: 64.85
    unit: mm
    page: 3
    stated_conditions:
      text: "Height : 64.85 ± 0.15mm"
    notes: "toleranta ±0.15 doar in text; confirmata in Fig.1 (page 7, 'With tube')"

  - property: cell_diameter_mm
    value: 18.33
    unit: mm
    page: 3
    stated_conditions:
      text: "Diameter : 18.33 ± 0.07mm"
    notes: "toleranta ±0.07 doar in text; confirmata in Fig.1 (page 7, 'With tube')"

  - property: charge_temp_range_c
    value: [0, 50]
    unit: degC
    page: 3
    stated_conditions:
      text: "Operating temperature (surface temperature) — Charge : 0 to 50℃ (recommended recharge release < 45℃)"
    notes: "temperatura de suprafata a celulei; reconfirmata in handling p. 12 ('Charge temperature ranges : 0℃ ~ 50℃')"

  - property: discharge_temp_range_c
    value: [-20, 75]
    unit: degC
    page: 3
    stated_conditions:
      text: "Operating temperature (surface temperature) — Discharge: -20 to 75℃ (recommended re-discharge release < 60℃)"
    notes: "temperatura de suprafata a celulei; reconfirmata in handling p. 12 ('Discharge Temperature ranges : -20℃ ~ 75℃')"

  - property: storage_temp_range_c
    value: [-30, 25]
    unit: degC
    page: 3
    stated_conditions:
      text: "Storage temperature (Recovery 90% after storage): 1.5 year -30~25℃(1*)"
    notes: "nota (1): ex-factory 50±5% SOC, 25℃; recuperare >90% din capacitatea de descarcare la 10A (100% = 2,450mAh la 25℃, SOC 100% dupa formare)"

  - property: storage_temp_range_c
    value: [-30, 45]
    unit: degC
    page: 3
    stated_conditions:
      text: "Storage temperature (Recovery 90% after storage): 3 months -30~45℃(1*)"
    notes: "aceeasi nota (1) ca la 1.5 year"

  - property: storage_temp_range_c
    value: [-30, 60]
    unit: degC
    page: 3
    stated_conditions:
      text: "Storage temperature (Recovery 90% after storage): 1 month -30~60℃(1*)"
    notes: "aceeasi nota (1) ca la 1.5 year"

  # ==========================================================================
  # 7.3–7.5 Characteristics — footer 3/16, page 4
  # ==========================================================================

  - property: nominal_capacity_ah
    value: 2.5
    unit: Ah
    page: 4
    stated_conditions:
      text: "measured with discharge current of 500mA(0.2C) with 2.5V cut-off at 25℃ within 1hour after the standard charge; Nominal discharge capacity ≥ 2,500mAh"
      temperature_c: 25
      discharge_current_a: 0.5
    notes: "bound Min (≥), criteriu de pass conform IEC61960 — nu valoare tipica; aceeasi valoare e afirmata si in 3.1 (page 3) cu conditii partiale — un singur claim, pastrat aici la aparitia cea mai completa (regula 2)"

  - property: rated_capacity_ah
    value: 2.45
    unit: Ah
    page: 4
    stated_conditions:
      text: "measured with discharge current of 10A with 2.5V cut-off at 25℃ within 1hour after the standard charge; Standard rated discharge capacity ≥ 2,450mAh"
      temperature_c: 25
      discharge_current_a: 10
    notes: "bound Min (≥); aceeasi valoare e referinta de 100% pentru toate tabelele 7.6–7.9 si pentru nota (1) de pe page 3"

  - property: internal_impedance_mohm
    value: 18
    unit: mohm
    page: 4
    stated_conditions:
      text: "Initial internal impedance measured at AC 1kHz after standard charge; Initial internal impedance ≤ 18mΩ"
    notes: "bound Max (≤); AC 1kHz, nu rezistenta DC"

  # ==========================================================================
  # 7.6 Temperature dependence of discharge capacity
  # (antet tabel pe page 4, randul de procente pe page 5, footer 4/16)
  # Conditii comune: descarcare 10A CC, 2.5V cut-off, dupa standard charge;
  # 100% = descarcarea la 25℃ la 10A (=2,450mAh).
  # ==========================================================================

  - property: rel_discharge_capacity_m20c_pct
    value: 60
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature -20℃"
      temperature_c: -20
      discharge_current_a: 10
    notes: "citit din tabel; 100% = 2,450mAh la 25℃/10A; la schimbare de temperatura intre charge/discharge, interval de 3h"

  - property: rel_discharge_capacity_m10c_pct
    value: 75
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature -10℃"
      temperature_c: -10
      discharge_current_a: 10
    notes: "citit din tabel; 100% = 2,450mAh la 25℃/10A"

  - property: rel_discharge_capacity_0c_pct
    value: 80
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature 0℃"
      temperature_c: 0
      discharge_current_a: 10
    notes: "citit din tabel; 100% = 2,450mAh la 25℃/10A"

  - property: rel_discharge_capacity_25c_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature 25℃"
      temperature_c: 25
      discharge_current_a: 10
    notes: "punct de referinta al tabelului (100% prin definitie)"

  - property: rel_discharge_capacity_60c_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature 60℃"
      temperature_c: 60
      discharge_current_a: 10
    notes: "citit din tabel; 100% = 2,450mAh la 25℃/10A"

  # ==========================================================================
  # 7.7 Temperature dependence of charge capacity — footer 4/16, page 5
  # Conditii comune: incarcare la temperatura indicata, descarcare 10A,
  # 2.5V cut-off la 25℃; 100% = 2,450mAh (25℃/10A). `temperature_c` de mai
  # jos este temperatura de INCARCARE (variabila tabelului).
  # ==========================================================================

  - property: rel_charge_capacity_0c_pct
    value: 80
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 0℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 0
      discharge_current_a: 10
    notes: "citit din tabel; interval 3h la schimbarea temperaturii intre charge si discharge"

  - property: rel_charge_capacity_5c_pct
    value: 90
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 5℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 5
      discharge_current_a: 10
    notes: "citit din tabel"

  - property: rel_charge_capacity_25c_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 25℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 25
      discharge_current_a: 10
    notes: "punct de referinta al tabelului"

  - property: rel_charge_capacity_45c_pct
    value: 95
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 45℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 45
      discharge_current_a: 10
    notes: "citit din tabel"

  - property: rel_charge_capacity_50c_pct
    value: 95
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 50℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 50
      discharge_current_a: 10
    notes: "citit din tabel"

  # ==========================================================================
  # 7.8 Charge rate capabilities — footer 4/16, page 5
  # Descarcare 10A CC, 2.5V cut-off, dupa incarcare la 4.2V; 100% = 2,450mAh.
  # `charge_current_a` este variabila tabelului.
  # ==========================================================================

  - property: rel_capacity_std_charge_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "Charge condition: Standard 1.25A, 125mA cut-off; discharge constant current 10A and 2.5V cut-off after the cell is charged with 4.2V"
      charge_current_a: 1.25
      discharge_current_a: 10
    notes: "citit din tabel; punct de referinta (100%)"

  - property: rel_capacity_rapid_charge_pct
    value: 98
    unit: pct
    page: 5
    stated_conditions:
      text: "Charge condition: Maximum rapid charge 4A, 100mA cut-off; discharge constant current 10A and 2.5V cut-off after the cell is charged with 4.2V"
      charge_current_a: 4
      discharge_current_a: 10
    notes: "citit din tabel; 100% = 2,450mAh la 25℃/10A"

  # ==========================================================================
  # 7.9 Discharge rate capabilities — footer 4/16, page 5
  # 2.5V cut-off dupa standard charge; 100% = 2,450mAh la 25℃/10A.
  # ==========================================================================

  - property: rel_discharge_capacity_0_5a_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 0.50A, 2.5V cut-off after the standard charge"
      discharge_current_a: 0.5
    notes: "citit din tabel; 100% = 2,450mAh la 25℃/10A (de aceea 0.5A poate fi 100%, nu >100%)"

  - property: rel_discharge_capacity_5a_pct
    value: 97
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 5A, 2.5V cut-off after the standard charge"
      discharge_current_a: 5
    notes: "citit din tabel"

  - property: rel_discharge_capacity_10a_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 10A, 2.5V cut-off after the standard charge"
      discharge_current_a: 10
    notes: "punct de referinta al tabelului"

  - property: rel_discharge_capacity_15a_pct
    value: 97
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 15A, 2.5V cut-off after the standard charge"
      discharge_current_a: 15
    notes: "citit din tabel"

  - property: rel_discharge_capacity_20a_pct
    value: 95
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 20A, 2.5V cut-off after the standard charge"
      discharge_current_a: 20
    notes: "citit din tabel"

  # ==========================================================================
  # 7.10–7.12 — footer 4/16, page 5
  # ==========================================================================

  - property: cycle_life_cycles
    value: 250
    unit: cycles
    page: 5
    stated_conditions:
      text: "With standard charge and maximum continuous discharge. Capacity after 250cycles, Capacity ≥ 1,500mAh (60% of the nominal capacity at 25℃)"
      charge_current_a: 1.25        # "standard charge", definit in 7.1 (1,250mA)
      discharge_current_a: 20       # "maximum continuous discharge", definit in 3.7 (20A)
      end_condition: "capacity >= 1,500mAh (60% of nominal) after 250 cycles"
    notes: "criteriu de pass, nu viata tipica; charge_current_a/discharge_current_a: cross-reference resolution — defensible ('standard charge' definit in 7.1 = 1,250mA; 'maximum continuous discharge' definit in 3.7 = 20A); temperatura de ciclare nedeclarata (25℃ califica doar masurarea capacitatii); '60% at 250 cycle' din 3.7 = aceeasi afirmatie, un singur claim"

  - property: cycle_life_retention_pct
    value: 60
    unit: pct
    page: 5
    stated_conditions:
      text: "Capacity after 250cycles, Capacity ≥ 1,500mAh (60% of the nominal capacity at 25℃)"
      temperature_c: 25
    notes: "bound Min (≥); pragul e afirmat ca valoare in document, deci claim separat pe langa end_condition-ul din cycle_life_cycles (conventia gold-urilor existente); echivalent absolut: 1,500mAh = 1.5 Ah"

  - property: storage_capacity_recovery_pct
    value: 90
    unit: pct
    page: 5
    stated_conditions:
      text: "Standard rated discharge capacity after storage for 1 month at 60℃ from the standard charged state is ≥ 90% of the initial 10A discharge capacity at 25℃"
      temperature_c: 60
      discharge_current_a: 10
    notes: "bound Min (≥); stocare 1 luna la 60℃ din stare standard charged; masurare la 25℃"

  - property: ex_factory_soc_pct
    value: 50
    unit: pct
    page: 5
    stated_conditions:
      text: "The cell should be shipped in 50 ± 5% charged state."
    notes: "toleranta ±5% doar in text; consistent cu nota (1) de pe page 3 (ex-factory 50±5% SOC, 25℃)"

  - property: ex_factory_ocv_range_v
    value: [3.600, 3.690]
    unit: V
    page: 5
    stated_conditions:
      text: "In this case [50 ± 5% charged state], OCV is from 3.600V to 3.690V."