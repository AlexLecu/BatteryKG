# GOLD STANDARD — Samsung SDI INR18650-25R, filled in by hand from
# "Specification of product", Spec. No. INR18650-25R, Version 1.0, Mar. 2014
# (In-Young Jang). Source file: Samsung-INR18650-25R-Datasheet.pdf
#
# `page` convention: the PHYSICAL PDF page (1 = cover). The document's own
# "N/16" footer corresponds to PDF page N+1 (e.g. section 3.0 sits on footer
# 2/16, hence page: 3).
#
# Coverage: 3.0 Nominal specifications (complete) + 7.3-7.12 Characteristics
# (complete, including the temperature- and rate-dependence tables).
# 6.1 (25±5℃, 65±20% RH) is a general test condition, not a cell property — it
# produces no claim, but is cited in notes where relevant.
# 8.x/9.x (mechanical/safety) and 10.0 (18-month warranty) are test criteria and
# commercial terms, not electrical cell specifications — deliberately excluded.
#
# Alignment with the exp10/exp11 rules (re-check applied):
#   R2  a repeated value = ONE claim, kept at its most complete occurrence
#       (nominal capacity: kept at 7.3/page 4; 3.1, note (1), 3.7 "60%",
#       handling p.12/13 — mentioned in notes only)
#   R4  cross-reference resolution marked explicitly in notes (cycle life)
#   R5  cycle_life_retention_pct = a separate claim, alongside end_condition
#   R6  NOT VERIFIED against data/claims/README.md (unavailable at the time).
#       Candidate names, possibly new or synonyms to be renamed before scoring:
#       charge_temp_range_c, discharge_temp_range_c,
#       storage_temp_range_{1_5yr,3mo,1mo}_c, rel_*_pct (all 17),
#       cycle_life_retention_pct, storage_recovery_pct, ex_factory_soc_pct,
#       ex_factory_ocv_range_v, std/rapid_charge_time_min,
#       max_charge_voltage_v (vs. the vocabulary's charge_voltage_v).
#       If they are still new: run scripts/gen_claims_vocab.py.

cell_model: Samsung INR18650-25R
manufacturer: Samsung SDI
source_document: Samsung-INR18650-25R-Datasheet.pdf
source_url: https://www.dnkpower.com/wp-content/uploads/2018/04/Samsung-INR18650-25R-Datasheet.pdf
retrieved: 2026-08-06

# Properties verified ABSENT — document read exhaustively (all 16 numbered
# pages, including Fig.1/Fig.2, handling, remarks and revision history).
omissions:
  - property: nominal_energy_wh
    note: "nominal energy appears nowhere; only capacity (mAh) and voltage (V) separately — searched 3.0 and 7.x"
  - property: specific_energy_wh_kg
    note: "energy density is not stated; only maximum mass (3.9) and capacity — searched the whole document"
  - property: max_pulse_discharge_a
    note: "no pulse discharge rating exists; only continuous 20A (3.7) — searched 3.0, 7.9 and the safety sections"
  - property: dc_internal_resistance_mohm
    note: "only AC 1kHz impedance (7.5); DC resistance (e.g. IEC pulse) is not specified"
  - property: self_discharge_pct_per_month
    note: "self-discharge is not quantified; only the >=90% recovery after storage (3.12 note 1, 7.11)"

claims:
  # ==========================================================================
  # 3.0 Nominal specifications — footer 2/16, page 3
  # ==========================================================================

  # nominal_capacity_ah: stated here as well (3.1, with partial conditions), but
  # under rule 2 it is ONE claim, kept at its most complete occurrence (7.3,
  # page 4) — see below.

  - property: nominal_voltage_v
    value: 3.6
    unit: V
    page: 3
    stated_conditions:
      text: "unspecified"

  - property: std_charge_current_a
    value: 1.25
    unit: A
    page: 3
    stated_conditions:
      text: "Standard charge: CCCV, 1.25A, 4.20 ± 0.05 V, 125mA cut-off"

  - property: max_charge_voltage_v
    value: 4.2
    unit: V
    page: 3
    stated_conditions:
      text: "Standard charge: CCCV, 1.25A, 4.20 ± 0.05 V, 125mA cut-off"
    notes: "the ±0.05V tolerance stays in the text only; confirmed as a limit in handling as well (p. 13: 'Cut-off voltage of charging must be less than 4.2 + 0.05V')"

  - property: fast_charge_current_a
    value: 4
    unit: A
    page: 3
    stated_conditions:
      text: "Rapid charge: CCCV, 4A, 4.20 ± 0.05 V, 100mA cut-off"
    notes: "given in 7.8 as 'Maximum rapid charge 4A' — it doubles as the maximum charge current"

  - property: std_charge_time_min
    value: 180
    unit: min
    page: 3
    stated_conditions:
      text: "Standard charge : 180min / 125mA cut-off"

  - property: rapid_charge_time_min
    value: 60
    unit: min
    page: 3
    stated_conditions:
      text: "Rapid charge: 60min (at 25℃) / 100mA cut-off"
      temperature_c: 25

  - property: max_cont_discharge_a
    value: 20
    unit: A
    page: 3
    stated_conditions:
      text: "Max. continuous discharge (Continuous): 20A(at 25℃), 60% at 250 cycle"
      temperature_c: 25
    notes: "bound Max; '60% at 250 cycle' ties the rating to the cycle-life criterion in 7.10"

  - property: discharge_cutoff_v
    value: 2.5
    unit: V
    page: 3
    stated_conditions:
      text: "Discharge cut-off voltage / End of discharge: 2.5V"

  - property: mass_g
    value: 45.0
    unit: g
    page: 3
    stated_conditions:
      text: "Cell weight: 45.0g max"
    notes: "bound Max"

  - property: cell_height_mm
    value: 64.85
    unit: mm
    page: 3
    stated_conditions:
      text: "Height : 64.85 ± 0.15mm"
    notes: "the ±0.15 tolerance stays in the text only; confirmed in Fig.1 (page 7, 'With tube')"

  - property: cell_diameter_mm
    value: 18.33
    unit: mm
    page: 3
    stated_conditions:
      text: "Diameter : 18.33 ± 0.07mm"
    notes: "the ±0.07 tolerance stays in the text only; confirmed in Fig.1 (page 7, 'With tube')"

  - property: charge_temp_range_c
    value: [0, 50]
    unit: degC
    page: 3
    stated_conditions:
      text: "Operating temperature (surface temperature) — Charge : 0 to 50℃ (recommended recharge release < 45℃)"
    notes: "cell surface temperature; reconfirmed in handling p. 12 ('Charge temperature ranges : 0℃ ~ 50℃')"

  - property: discharge_temp_range_c
    value: [-20, 75]
    unit: degC
    page: 3
    stated_conditions:
      text: "Operating temperature (surface temperature) — Discharge: -20 to 75℃ (recommended re-discharge release < 60℃)"
    notes: "cell surface temperature; reconfirmed in handling p. 12 ('Discharge Temperature ranges : -20℃ ~ 75℃')"

  - property: storage_temp_range_c
    value: [-30, 25]
    unit: degC
    page: 3
    stated_conditions:
      text: "Storage temperature (Recovery 90% after storage): 1.5 year -30~25℃(1*)"
    notes: "note (1): ex-factory 50±5% SOC, 25℃; recovery >90% of the 10A discharge capacity (100% = 2,450mAh at 25℃, SOC 100% after formation)"

  - property: storage_temp_range_c
    value: [-30, 45]
    unit: degC
    page: 3
    stated_conditions:
      text: "Storage temperature (Recovery 90% after storage): 3 months -30~45℃(1*)"
    notes: "the same note (1) as for 1.5 year"

  - property: storage_temp_range_c
    value: [-30, 60]
    unit: degC
    page: 3
    stated_conditions:
      text: "Storage temperature (Recovery 90% after storage): 1 month -30~60℃(1*)"
    notes: "the same note (1) as for 1.5 year"

  # ==========================================================================
  # 7.3-7.5 Characteristics — footer 3/16, page 4
  # ==========================================================================

  - property: nominal_capacity_ah
    value: 2.5
    unit: Ah
    page: 4
    stated_conditions:
      text: "measured with discharge current of 500mA(0.2C) with 2.5V cut-off at 25℃ within 1hour after the standard charge; Nominal discharge capacity ≥ 2,500mAh"
      temperature_c: 25
      discharge_current_a: 0.5
    notes: "bound Min (≥), a pass criterion per IEC61960 — not a typical value; the same value is also stated in 3.1 (page 3) with partial conditions — one claim, kept here at its most complete occurrence (rule 2)"

  - property: rated_capacity_ah
    value: 2.45
    unit: Ah
    page: 4
    stated_conditions:
      text: "measured with discharge current of 10A with 2.5V cut-off at 25℃ within 1hour after the standard charge; Standard rated discharge capacity ≥ 2,450mAh"
      temperature_c: 25
      discharge_current_a: 10
    notes: "bound Min (≥); the same value is the 100% reference for all of tables 7.6-7.9 and for note (1) on page 3"

  - property: internal_impedance_mohm
    value: 18
    unit: mohm
    page: 4
    stated_conditions:
      text: "Initial internal impedance measured at AC 1kHz after standard charge; Initial internal impedance ≤ 18mΩ"
    notes: "bound Max (≤); AC 1kHz, not DC resistance"

  # ==========================================================================
  # 7.6 Temperature dependence of discharge capacity
  # (table header on page 4, the percentage row on page 5, footer 4/16)
  # Common conditions: 10A CC discharge, 2.5V cut-off, after standard charge;
  # 100% = the 25℃ discharge at 10A (=2,450mAh).
  # ==========================================================================

  - property: rel_discharge_capacity_m20c_pct
    value: 60
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature -20℃"
      temperature_c: -20
      discharge_current_a: 10
    notes: "read from the table; 100% = 2,450mAh at 25℃/10A; when the temperature changes between charge and discharge, a 3h interval applies"

  - property: rel_discharge_capacity_m10c_pct
    value: 75
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature -10℃"
      temperature_c: -10
      discharge_current_a: 10
    notes: "read from the table; 100% = 2,450mAh at 25℃/10A"

  - property: rel_discharge_capacity_0c_pct
    value: 80
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature 0℃"
      temperature_c: 0
      discharge_current_a: 10
    notes: "read from the table; 100% = 2,450mAh at 25℃/10A"

  - property: rel_discharge_capacity_25c_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature 25℃"
      temperature_c: 25
      discharge_current_a: 10
    notes: "the table's reference point (100% by definition)"

  - property: rel_discharge_capacity_60c_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "discharge constant current 10A and 2.5V cut-off after the standard charge; discharge temperature 60℃"
      temperature_c: 60
      discharge_current_a: 10
    notes: "read from the table; 100% = 2,450mAh at 25℃/10A"

  # ==========================================================================
  # 7.7 Temperature dependence of charge capacity — footer 4/16, page 5
  # Common conditions: charge at the stated temperature, discharge at 10A,
  # 2.5V cut-off at 25℃; 100% = 2,450mAh (25℃/10A). The `temperature_c` below
  # is the CHARGE temperature (the table's variable).
  # ==========================================================================

  - property: rel_charge_capacity_0c_pct
    value: 80
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 0℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 0
      discharge_current_a: 10
    notes: "read from the table; 3h interval when the temperature changes between charge and discharge"

  - property: rel_charge_capacity_5c_pct
    value: 90
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 5℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 5
      discharge_current_a: 10
    notes: "read from the table"

  - property: rel_charge_capacity_25c_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 25℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 25
      discharge_current_a: 10
    notes: "the table's reference point"

  - property: rel_charge_capacity_45c_pct
    value: 95
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 45℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 45
      discharge_current_a: 10
    notes: "read from the table"

  - property: rel_charge_capacity_50c_pct
    value: 95
    unit: pct
    page: 5
    stated_conditions:
      text: "charge temperature 50℃, discharge temperature 25℃; discharge constant current 10A and 2.5V cut-off"
      temperature_c: 50
      discharge_current_a: 10
    notes: "read from the table"

  # ==========================================================================
  # 7.8 Charge rate capabilities — footer 4/16, page 5
  # 10A CC discharge, 2.5V cut-off, after charging to 4.2V; 100% = 2,450mAh.
  # `charge_current_a` is the table's variable.
  # ==========================================================================

  - property: rel_capacity_std_charge_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "Charge condition: Standard 1.25A, 125mA cut-off; discharge constant current 10A and 2.5V cut-off after the cell is charged with 4.2V"
      charge_current_a: 1.25
      discharge_current_a: 10
    notes: "read from the table; reference point (100%)"

  - property: rel_capacity_rapid_charge_pct
    value: 98
    unit: pct
    page: 5
    stated_conditions:
      text: "Charge condition: Maximum rapid charge 4A, 100mA cut-off; discharge constant current 10A and 2.5V cut-off after the cell is charged with 4.2V"
      charge_current_a: 4
      discharge_current_a: 10
    notes: "read from the table; 100% = 2,450mAh at 25℃/10A"

  # ==========================================================================
  # 7.9 Discharge rate capabilities — footer 4/16, page 5
  # 2.5V cut-off after standard charge; 100% = 2,450mAh at 25℃/10A.
  # ==========================================================================

  - property: rel_discharge_capacity_0_5a_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 0.50A, 2.5V cut-off after the standard charge"
      discharge_current_a: 0.5
    notes: "read from the table; 100% = 2,450mAh at 25℃/10A (which is why 0.5A can be 100%, not >100%)"

  - property: rel_discharge_capacity_5a_pct
    value: 97
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 5A, 2.5V cut-off after the standard charge"
      discharge_current_a: 5
    notes: "read from the table"

  - property: rel_discharge_capacity_10a_pct
    value: 100
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 10A, 2.5V cut-off after the standard charge"
      discharge_current_a: 10
    notes: "the table's reference point"

  - property: rel_discharge_capacity_15a_pct
    value: 97
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 15A, 2.5V cut-off after the standard charge"
      discharge_current_a: 15
    notes: "read from the table"

  - property: rel_discharge_capacity_20a_pct
    value: 95
    unit: pct
    page: 5
    stated_conditions:
      text: "Discharge condition: 20A, 2.5V cut-off after the standard charge"
      discharge_current_a: 20
    notes: "read from the table"

  # ==========================================================================
  # 7.10-7.12 — footer 4/16, page 5
  # ==========================================================================

  - property: cycle_life_cycles
    value: 250
    unit: cycles
    page: 5
    stated_conditions:
      text: "With standard charge and maximum continuous discharge. Capacity after 250cycles, Capacity ≥ 1,500mAh (60% of the nominal capacity at 25℃)"
      charge_current_a: 1.25        # "standard charge", defined in 7.1 (1,250mA)
      discharge_current_a: 20       # "maximum continuous discharge", defined in 3.7 (20A)
      end_condition: "capacity >= 1,500mAh (60% of nominal) after 250 cycles"
    notes: "a pass criterion, not typical life; charge_current_a/discharge_current_a: cross-reference resolution — defensible ('standard charge' defined in 7.1 = 1,250mA; 'maximum continuous discharge' defined in 3.7 = 20A); the cycling temperature is not stated (25℃ qualifies only the capacity measurement); the '60% at 250 cycle' in 3.7 is the same assertion, one claim"

  - property: cycle_life_retention_pct
    value: 60
    unit: pct
    page: 5
    stated_conditions:
      text: "Capacity after 250cycles, Capacity ≥ 1,500mAh (60% of the nominal capacity at 25℃)"
      temperature_c: 25
    notes: "bound Min (≥); the threshold is stated as a value in the document, so it is a separate claim alongside the end_condition of cycle_life_cycles (the convention of the existing golds); absolute equivalent: 1,500mAh = 1.5 Ah"

  - property: storage_capacity_recovery_pct
    value: 90
    unit: pct
    page: 5
    stated_conditions:
      text: "Standard rated discharge capacity after storage for 1 month at 60℃ from the standard charged state is ≥ 90% of the initial 10A discharge capacity at 25℃"
      temperature_c: 60
      discharge_current_a: 10
    notes: "bound Min (≥); 1 month of storage at 60℃ from the standard charged state; measured at 25℃"

  - property: ex_factory_soc_pct
    value: 50
    unit: pct
    page: 5
    stated_conditions:
      text: "The cell should be shipped in 50 ± 5% charged state."
    notes: "the ±5% tolerance stays in the text only; consistent with note (1) on page 3 (ex-factory 50±5% SOC, 25℃)"

  - property: ex_factory_ocv_range_v
    value: [3.600, 3.690]
    unit: V
    page: 5
    stated_conditions:
      text: "In this case [50 ± 5% charged state], OCV is from 3.600V to 3.690V."
