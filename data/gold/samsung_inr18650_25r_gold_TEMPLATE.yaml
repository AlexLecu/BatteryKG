# GOLD STANDARD — TEMPLATE GOL, de completat manual.
#
# Samsung SDI INR18650-25R — datasheet nevazut, pentru evaluarea held-out a
# pipeline-ului de extractie. NICIUN LLM nu a atins acest document.
#
# Format identic cu data/claims/*.yaml (vezi data/claims/README.md).
# Fisierul sta DELIBERAT in data/gold/, nu in data/claims/: patru module
# (src/kg/claims.py, src/kg/spec_consistency.py, src/agents/evaluation.py,
# src/agents/experiment_03.py) fac glob pe data/claims/*.yaml, iar un template
# cu campuri goale ar fi incarcat ca si claim real si ar corupe graful si
# tabelele. Se muta in data/claims/ DUPA ce e completat si verificat.
#
# ---------------------------------------------------------------------------
# CONVENTII (derivate din cele 62 de claims existente — vezi raspunsul asociat)
#
#   value        numarul citit din document, in unitatea din `unit`.
#                Range -> [lo, hi]. Toleranta X±Y -> se scrie DOAR valoarea
#                centrala X; ±Y ramane exclusiv in `text`.
#                Bound "Max."/"Min." -> se scrie numarul; cuvantul ramane in
#                `text` (regula de bound il citeste de acolo).
#   unit         Ah | mAh | V | A | C | cycles | pct | degC | g | mohm | Wh/kg …
#                Se scrie unitatea DUPA normalizare (3200mAh -> 3.2 Ah).
#   page         pagina din PDF, obligatoriu, ca sa fie re-verificabil.
#   stated_conditions.text
#                verbatim/cvasi-verbatim din datasheet. Daca documentul NU
#                declara conditii: exact sirul `unspecified` — omisiunea e ea
#                insasi un rezultat, nu se inventeaza conditii.
#   cond_*       campuri parsate, SETATE DOAR daca sunt declarate explicit.
#                Un camp absent inseamna "nedeclarat" si NU va genera niciodata
#                condition_mismatch la reconciliere.
#   notes        optional; obligatoriu cand valoarea e citita de pe grafic
#                ("read from graph") sau cand e criteriu de pass, nu tipic.
#   omissions    proprietati verificat absente din document (dupa parcurgere
#                exhaustiva) — se scriu doar daca s-a cautat efectiv.
# ---------------------------------------------------------------------------

