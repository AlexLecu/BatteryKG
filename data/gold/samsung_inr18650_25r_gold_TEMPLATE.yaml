# GOLD STANDARD — EMPTY TEMPLATE, to be filled in by hand.
#
# Samsung SDI INR18650-25R — an unseen datasheet, for the held-out evaluation of
# the extraction pipeline. NO LLM has touched this document.
#
# Same format as data/claims/*.yaml (see data/claims/README.md).
# The file sits DELIBERATELY in data/gold/, not data/claims/: four modules
# (src/kg/claims.py, src/kg/spec_consistency.py, src/agents/evaluation.py,
# src/agents/experiment_03.py) glob data/claims/*.yaml, and a template with
# empty fields would be loaded as a real claim and corrupt the graph and the
# tables. Move it to data/claims/ ONLY once filled in and verified.
#
# ---------------------------------------------------------------------------
# CONVENTIONS (derived from the 62 existing claims)
#
#   value        the number as read from the document, in the unit given by
#                `unit`. Range -> [lo, hi]. A tolerance X±Y -> write ONLY the
#                central value X; ±Y stays exclusively in `text`.
#                A bound "Max."/"Min." -> write the number; the word stays in
#                `text` (the bound rule reads it from there).
#   unit         Ah | mAh | V | A | C | cycles | pct | degC | g | mohm | Wh/kg …
#                Write the unit AFTER normalisation (3200mAh -> 3.2 Ah).
#   page         the PDF page, mandatory, so the claim stays re-checkable.
#   stated_conditions.text
#                verbatim/near-verbatim from the datasheet. If the document does
#                NOT state conditions: exactly the string `unspecified` — the
#                omission is itself a result; never invent conditions.
#   cond_*       parsed fields, SET ONLY if they are explicitly stated.
#                An absent field means "not stated" and will NEVER produce a
#                condition_mismatch during reconciliation.
#   notes        optional; mandatory when the value is read off a graph
#                ("read from graph") or when it is a pass criterion rather than
#                a typical value.
#   omissions    properties verified absent from the document (after an
#                exhaustive read) — record them only if you actually searched.
# ---------------------------------------------------------------------------

