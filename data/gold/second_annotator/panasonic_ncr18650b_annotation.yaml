# ---------------------------------------------------------------------------
# OMISSIONS — properties actively searched for and confirmed ABSENT.
# ---------------------------------------------------------------------------
omissions:

  - property: cycle_life_cycles
    note: "THE MAJOR ABSENCE IN THIS DOCUMENT: there is no cycle-life claim of any
           kind. No cycle count, no fade curve, no life projection. Searched every
           row of the page-1 specification table, the drawing area, and the titles,
           captions, axes and legends of all three plots on pages 2-4 — the three
           plots are rate, temperature and charge characteristics, none of them a
           cycling test. For a cell datasheet this is the property a reader would
           most expect, and its absence is the headline finding for this file"

  - property: cycle_life_retention_pct
    note: "absent as a consequence of the above — with no cycle-life claim there is
           no end-of-life capacity threshold either. Searched the same places"

  - property: max_cont_discharge_a
    note: "no maximum continuous discharge current is stated. The sheet plots
           discharge at up to 2.0CA (about 6.5 A) on page 2 and at 3.25 A on page
           3, but never states a permitted maximum, so a reader cannot tell what
           discharge current the cell is rated for. Searched the page-1 table
           (which has no discharge-current row at all) and the plot captions"

  - property: max_charge_current_a
    note: "no maximum charge current is stated. The table gives 'Charging Current |
           Std.1625mA' — the 'Std.' qualifier implies a maximum exists, but none is
           given. Searched the page-1 table and the page-4 charge plot caption"

  - property: internal_impedance_mohm
    note: "no AC or DC internal resistance figure. Searched the page-1 table and
           all three plot captions; the charge plot on page 4 shows a current
           trace but no impedance value is stated anywhere"

  - property: storage_capacity_remaining_pct
    note: "no storage performance claim. Page 1 gives a storage AMBIENT TEMPERATURE
           range (-20~+50°C) but attaches no duration and no retained-capacity
           figure to it, so the sheet says where cells may be stored but not what
           happens to them if they are. Searched the page-1 table and all plots;
           storage_capacity_recovery_pct is absent for the same reason"

  - property: discharge_cutoff_v
    note: "partial absence, recorded because of where the value lives: the end
           voltage 2.50 V appears only inside the plot captions on pages 2 and 3
           ('E.V.:2.50V'). The page-1 specification table has no discharge cut-off
           row, so the capacities it states (3200/3250/3350 mAh) are given with no
           end voltage attached to them at all. Searched every row of the table"
