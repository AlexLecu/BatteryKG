# Second-annotator extraction from the 4-page Panasonic NCR18650B marketing
# datasheet (doc code 2G23X0KYKU). Image-only PDF with no text layer, so every
# value was read from the rendered pages. `page` = physical PDF page.
cell_model: Panasonic NCR18650B
manufacturer: Panasonic
source_document: panasonic_ncr18650b.pdf

annotator: A2
annotated_date: 2026-08-14

new_properties:
  - name: diameter_mm
    meaning: cell outer diameter stated as a specification value
  - name: height_mm
    meaning: cell height stated as a specification value
  - name: terminal_diameter_mm
    meaning: diameter of the raised positive terminal / top cap, the dimension labelled "d" on the drawing
  - name: discharge_capacity_ah
    meaning: capacity delivered to the stated end voltage under stated discharge conditions, read off a discharge curve
  - name: charge_capacity_ah
    meaning: capacity accepted during a full CC-CV charge at a stated temperature, read off a charge curve
  - name: std_charge_end_current_a
    meaning: charge-termination cut-off current of the standard charge, converted mA to A

