# Second-annotator extraction from the SANYO/Panasonic full product
# specification "Specifications of Lithium Ion battery (Cylindrical Type)",
# File No. NCR18650-068, type NCR18650B-H00BA, issued 2012-05-29 (Tentative).
# `page` = physical PDF page; printed "page N/13" sits on physical page N+2.
cell_model: Panasonic NCR18650B (SANYO NCR18650B-H00BA)
manufacturer: SANYO Electric Co., Ltd. / Panasonic
source_document: panasonic_ncr18650b_full_spec_sanyo.pdf

annotator: A2
annotated_date: 2026-08-14

new_properties:
  - name: discharge_time_min
    meaning: duration of discharge to the stated end voltage at a stated current, in minutes as printed
  - name: shipping_state_soc_pct
    meaning: state of charge the cells are shipped at, as a percentage of full charge
  - name: precharge_current_a
    meaning: current used to pre-charge a cell that has fallen below the pre-charge threshold voltage
  - name: precharge_threshold_voltage_v
    meaning: cell voltage below which pre-charging rather than standard charging must be used
  - name: over_discharge_limit_v
    meaning: absolute floor voltage below which the cell must not be discharged, distinct from the normal discharge end voltage
  - name: series_discharge_cutoff_v
    meaning: discharge end voltage required per cell when cells are connected in series
  - name: storage_humidity_max_pct
    meaning: maximum relative humidity permitted during storage

# ---------------------------------------------------------------------------
# CLAIMS
# ---------------------------------------------------------------------------
claims:

  # === Section 5, Nominal Specifications — physical page 8 (printed 6/13) ===

  - property: rated_capacity_ah
    value: 3.2
    unit: Ah
    page: 8
    stated_conditions:
      text: "5.1 Rated Capacity (Minimum) | 3200mAh | Notes: 0.65A discharge at 20℃"
      discharge_current_a: 0.65
      temperature_c: 20
    notes: "lower bound — the row is headed '(Minimum)'."

  - property: nominal_capacity_ah
    value: 3.25
    unit: Ah
    page: 8
    stated_conditions:
      text: "5.2 Nominal Capacity (Minimum) | 3250mAh | Notes: 0.65A discharge at 25℃"
      discharge_current_a: 0.65
      temperature_c: 25
    notes: "lower bound — '(Minimum)'."

  - property: nominal_capacity_ah
    value: 3.35
    unit: Ah
    page: 8
    stated_conditions:
      text: "5.3 Nominal Capacity (Typical) | 3350mAh | Notes: Reference only"
  - property: nominal_voltage_v
    value: 3.6
    unit: V
    page: 8
    stated_conditions:
      text: "5.4 Nominal Voltage | 3.6V | Notes: 0.65A discharge"
      discharge_current_a: 0.65
    notes: "discharge current stated but no temperature for this row"

  - property: discharge_cutoff_v
    value: 2.5
    unit: V
    page: 8
    stated_conditions:
      text: "5.5 Discharging End Voltage | 2.5V"
    notes: "restated in 10-1(2) on physical page 11 ('The discharge end voltage
            should be more than 2.5V/cell') and used throughout section 6; recorded
            once here"

  - property: std_charge_current_a
    value: 1.625
    unit: A
    page: 8
    stated_conditions:
      text: "5.6 Charging Current (Std.) | 1.625A"
      charge_voltage_v: 4.20
      temperature_c: 25
    notes: "cross-reference resolved: 6.1 Full Charge on physical page 9 adds that
            the CC-CV charge to 4.20V runs a total of 4.0 hours at 25℃."

  - property: charge_voltage_v
    value: 4.20
    unit: V
    page: 8
    stated_conditions:
      text: "5.7 Charging Voltage | 4.20 ± 0.03V"
      charge_current_a: 1.625
    notes: "only the central value 4.20 is recorded; the ± 0.03 stays in the quoted
            text."

  - property: std_charge_time_h
    value: 4.0
    unit: h
    page: 8
    stated_conditions:
      text: "5.8 Charging Time (Std.) | 4.0 hours"
      charge_current_a: 1.625
      charge_voltage_v: 4.20
      temperature_c: 25
    notes: "printed in hours, recorded in hours with no conversion."

  - property: max_cont_discharge_a
    value: 4.875
    unit: A
    page: 8
    stated_conditions:
      text: "5.9 Continuous Discharging Current (Max.)※1 | 4.875A | Notes: 0 ~ +40℃.
             ※1 'The maximum discharge current for a single cell use. However after
             the battery pack assembly, there will be a limitation of maximum
             discharge current due to a protection circuit or a protection device.'"
    notes: "the ※1 footnote is folded into the text as part of this row's
