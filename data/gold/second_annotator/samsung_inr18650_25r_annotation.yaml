# ---------------------------------------------------------------------------
# OMISSIONS — properties actively searched for and confirmed ABSENT.
# ---------------------------------------------------------------------------
omissions:

  - property: max_charge_voltage_v
    note: "no absolute maximum charge voltage is stated. 3.3 and 3.4 give the
           standard and rapid charge voltage as 4.20 ± 0.05 V, and 7.8 says the
           cell 'is charged with 4.2V', but nothing states a not-to-exceed limit or
           what happens above it. Searched the whole of section 3.0, section 7.0
           and the handling precautions on physical pages 9-11, which discuss
           over-charge protection qualitatively but state no voltage"

  - property: max_charge_current_a
    note: "no maximum charge current as such. 3.4 gives a rapid charge current of
           4A and 7.8 labels it 'Maximum rapid charge 4A', which is the closest the
           document comes, but it is presented as the rapid-charge condition rather
           than as an absolute ceiling, and no other charge current is permitted or
           forbidden by name. Searched sections 3.0, 7.2, 7.8 and the design
           precautions on physical pages 10-11"

  - property: gravimetric_energy_density_wh_kg
    note: "no Wh/kg figure. Searched sections 3.0 and 7.0. The document gives
           capacity, nominal voltage and a maximum weight, but '45.0g max' is a
           bound rather than an actual mass, so an energy density is not even
           computable from stated values without assuming the weight — and
           computing it would introduce a number the document does not state"

  - property: volumetric_energy_density_wh_l
    note: "no Wh/L figure. Searched sections 3.0 and 7.0 and both figures; the
           dimensions in 3.10 and Fig.1 would allow a volume to be computed but the
           document never states an energy density"

  - property: storage_capacity_remaining_pct
    note: "partial absence worth recording alongside the 7.11 claim: the three
           storage-temperature rows in 3.12 cover 1 month, 3 months and 1.5 years,
           but the only measured storage claims are for ONE month — 7.11 (1 month
           at 60℃ from the charged state) and Note (1) (ex-factory state). Neither
           the 3-month nor the 1.5-year row has any retained- or recovered-capacity
           figure attached, so the long-duration limits are permissions without an
           associated performance guarantee. Searched 3.12, its Note (1), 7.11 and
           11.1 (which recommends dry low-temperature storage for 3 months or more
           but states no number)"

  - property: cycle_life_cycles
    note: "partial absence: cycle life is specified at exactly one condition — the
           standard charge with the 20A maximum continuous discharge, 250 cycles.
           anticipates a life claim per rate, and this document plots capacity
           against five discharge rates in 7.9 and two charge rates in 7.8 without
           giving a cycle life for any of them. So the cycle life at the standard
           0.2C or 10A discharge — the rates its own capacity claims are defined at
