    page: 3
    stated_conditions:
      text: "3.3 Standard charge | CCCV, 1.25A, 4.20 ± 0.05 V, 125mA cut-off"
      charge_voltage_v: 4.20
      end_current_ma: 125
      temperature_c: 25
      charge_c_rate: 0.5
    notes: "cross-reference resolved: 7.1 on physical page 4 restates this as
            'charge current 0.5CmA (1,250mA), constant voltage 4.2V and 125mA cut-
            off in CV mode at 25℃', which is where the temperature and the 0.5C rate
            come from."

  - property: charge_voltage_v
    value: 4.20
    unit: V
    page: 3
    stated_conditions:
      text: "3.3 Standard charge | CCCV, 1.25A, 4.20 ± 0.05 V, 125mA cut-off"
      charge_current_a: 1.25
      end_current_ma: 125
      temperature_c: 25
    notes: "only the central value 4.20 is recorded; the ± 0.05 stays in the quoted
