# Second-annotator extraction from the Samsung SDI "Specification of product",
# Spec. No. INR18650-25R, Version 1.0, Mar. 2014.
# `page` = physical PDF page; the printed footer "- N/16 -" sits on page N+1.
cell_model: Samsung INR18650-25R
manufacturer: Samsung SDI Co., Ltd.
source_document: samsung_inr18650_25r.pdf

annotator: A2
annotated_date: 2026-08-14

new_properties:
  - name: std_charge_time_min
    meaning: duration of the standard charge, in minutes as printed
  - name: fast_charge_time_min
    meaning: duration of the rapid charge, in minutes as printed
  - name: std_charge_end_current_a
    meaning: charge-termination cut-off current of the standard charge, converted mA to A
  - name: fast_charge_end_current_a
    meaning: charge-termination cut-off current of the rapid charge, converted mA to A
  - name: height_mm
    meaning: cell height stated as a specification value
  - name: diameter_mm
    meaning: cell diameter stated as a specification value
  - name: recommended_recharge_release_temp_c
    meaning: cell surface temperature below which recharging is recommended to be released/resumed
  - name: recommended_redischarge_release_temp_c
    meaning: cell surface temperature below which re-discharging is recommended to be released/resumed
  - name: relative_discharge_capacity_pct
    meaning: discharge capacity under a stated charge or discharge rate, as a percentage of the 10A/25℃ reference capacity
  - name: shipping_state_soc_pct
    meaning: state of charge the cells are shipped at, as a percentage of full charge
  - name: ex_factory_ocv_range_v
    meaning: open-circuit voltage window corresponding to the ex-factory state of charge

# ---------------------------------------------------------------------------
# CLAIMS
# ---------------------------------------------------------------------------
claims:

  # === Section 3.0, Nominal specifications — physical page 3 (printed 2/16) =

  - property: nominal_voltage_v
    value: 3.6
    unit: V
    page: 3
    stated_conditions:
      text: "3.2 Nominal voltage | 3.6V"
    notes: "no discharge current, temperature or averaging basis stated for this
            row, unlike the capacity rows above and below it"

  - property: std_charge_current_a
    value: 1.25
