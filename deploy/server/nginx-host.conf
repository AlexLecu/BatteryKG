# Host nginx site for BatteryKG: /etc/nginx/sites-available/batterykg
# TLS is terminated by the university reverse proxy, which forwards plain HTTP here.
# Listens on the same ports as the other sites on this server.
server {
    listen 80;
    listen 3000;
    server_name batterykg.utcluj.ro;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
