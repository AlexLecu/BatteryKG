# Inside the batterykg-web container: static UI + the API under one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The icon is favicon.svg; answer the browsers' automatic /favicon.ico probe plainly
    location = /favicon.ico {
        log_not_found off;
        return 404;
    }

    # Vue router (history mode): unknown paths fall back to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
